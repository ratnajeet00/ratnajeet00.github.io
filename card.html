<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Ratnajeet Patil - Software Engineer Digital Business Card">
    <meta name="theme-color" content="#0b1020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- PWA Manifest for Offline Support -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlJhdG5hamVldCBQYXRpbCAtIERpZ2l0YWwgQ2FyZCIsCiAgInNob3J0X25hbWUiOiAiUmF0bmFqZWV0IiwKICAic3RhcnRfdXJsIjogIi9jYXJkLmh0bWwiLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiM2NjdlZWEiLAogICJ0aGVtZV9jb2xvciI6ICIjNmM2M2ZmIgp9">
    
    <title>Ratnajeet Patil - Digital Card</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome - with fallback -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" onerror="this.onerror=null;">
    
    <!-- Google Fonts - with fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" onerror="this.onerror=null;">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'VT323', monospace;
            background: #0b1020;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            color: #e6fbff;
            background-image:
                linear-gradient(0deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 20% 15%, rgba(255, 59, 141, 0.16), transparent 30%),
                radial-gradient(circle at 80% 90%, rgba(0, 240, 255, 0.12), transparent 28%);
            background-size: 18px 18px, 18px 18px, auto, auto;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.18) 0, rgba(255, 255, 255, 0) 50%);
            background-size: 100% 4px;
            mix-blend-mode: soft-light;
            opacity: 0.45;
            z-index: 50;
            animation: scanline 6s linear infinite;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0 2px, rgba(0, 0, 0, 0.03) 2px 4px);
            z-index: 49;
            opacity: 0.3;
        }

        body.palette-shift {
            filter: hue-rotate(10deg) saturate(1.08);
        }

        body.crt-flicker::before {
            opacity: 0.75;
        }

        .card-container {
            background: #121b34;
            border: 3px solid #2a4d93;
            box-shadow: 8px 8px 0 #07112a;
            max-width: 450px;
            width: 100%;
            margin: 20px auto;
            animation: popIn 0.36s steps(6, end);
            position: relative;
            z-index: 1;
            overflow: hidden;
            transform: translate(var(--card-x, 0px), var(--card-y, 0px));
            transition: transform 0.12s steps(3, end);
        }

        .card-container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 59, 141, 0.09), transparent 40%);
        }

        .card-header {
            background: #10182f;
            padding: 24px 20px 28px;
            text-align: center;
            color: #e6fbff;
            position: relative;
            border-bottom: 3px solid #2a4d93;
        }

        .card-header::before {
            content: '[ PIXEL_CONTACT.EXE ]';
            position: absolute;
            top: 7px;
            left: 10px;
            font-size: 10px;
            color: #ffe761;
            letter-spacing: 1px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border: 3px solid #00f0ff;
            box-shadow: 5px 5px 0 #07112a;
            margin: 0 auto 18px;
            object-fit: cover;
            image-rendering: pixelated;
            filter: contrast(1.08) saturate(1.05);
        }

        .card-header h1 {
            font-size: 18px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .card-header .title {
            font-size: 11px;
            color: #00f0ff;
            margin-bottom: 10px;
        }

        .card-header .tagline {
            font-family: 'VT323', monospace;
            font-size: 24px;
            color: #9ec3ff;
            line-height: 1.2;
        }

        .card-body {
            padding: 24px 18px;
            min-height: 360px;
            background: #121b34;
        }

        .info-section {
            margin-bottom: 18px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background: #182446;
            border: 2px solid #35579d;
            transition: all 0.16s steps(3, end);
            cursor: pointer;
            box-shadow: 4px 4px 0 #07112a;
        }

        .info-item:hover {
            background: #24386e;
            transform: translate(-2px, -2px);
            border-color: #00f0ff;
        }

        .info-item i {
            color: #00f0ff;
            width: 38px;
            height: 38px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #10182f;
            border: 2px solid #35579d;
            transition: all 0.16s steps(3, end);
        }

        .info-item .info-text {
            flex: 1;
            color: #e6fbff;
            font-family: 'VT323', monospace;
            font-size: 25px;
            margin-left: 12px;
            line-height: 1.1;
        }

        .info-item a {
            color: #e6fbff;
            text-decoration: none;
        }

        .info-item a:hover {
            color: #ffe761;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 2px solid #2a4d93;
        }

        .social-btn {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #182446;
            border: 2px solid #35579d;
            color: #00f0ff;
            font-size: 22px;
            transition: all 0.16s steps(3, end);
            text-decoration: none;
            box-shadow: 4px 4px 0 #07112a;
        }

        .social-btn:hover {
            transform: translate(-2px, -2px);
            background: #ff3b8d;
            border-color: #ffe761;
            color: #fff;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .action-btn {
            padding: 14px 8px;
            border: 2px solid #35579d;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.16s steps(3, end);
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 4px 4px 0 #07112a;
        }

        .action-btn.primary {
            background: #00f0ff;
            color: #081020;
        }

        .action-btn.primary:hover {
            transform: translate(-2px, -2px);
            background: #ffe761;
        }

        .action-btn.secondary {
            background: #182446;
            color: #e6fbff;
            border-color: #ff3b8d;
        }

        .action-btn.secondary:hover {
            background: #ff3b8d;
            color: #fff;
            transform: translate(-2px, -2px);
        }

        .save-contact {
            width: 100%;
            margin-top: 12px;
        }

        .success-animation {
            background: #8cff66 !important;
            border-color: #d7ff61 !important;
            color: #061412 !important;
            animation: success 0.28s steps(3, end);
        }

        .ripple {
            position: absolute;
            background: rgba(255, 231, 97, 0.35);
            transform: scale(0);
            animation: ripple-animation 0.5s steps(4, end);
            pointer-events: none;
        }

        @keyframes scanline {
            from { transform: translateY(0); }
            to { transform: translateY(4px); }
        }

        @keyframes success {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes ripple-animation {
            to {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translate(0, 12px);
            }
            to {
                opacity: 1;
                transform: translate(0, 0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 40px;
            }

            .card-container {
                margin: 8px auto;
                max-width: 100%;
            }

            .card-header h1 {
                font-size: 15px;
            }

            .card-header .title {
                font-size: 10px;
            }

            .card-header .tagline {
                font-size: 20px;
            }

            .profile-image {
                width: 100px;
                height: 100px;
            }

            .card-body {
                padding: 18px 14px 24px;
                min-height: 0;
            }

            .action-btn {
                font-size: 9px;
                padding: 12px 6px;
            }

            .social-btn {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }

            .info-item .info-text {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card-header">
            <img src="img/profile-photo.jpeg" alt="Ratnajeet Patil" class="profile-image">
            <h1>Ratnajeet Patil</h1>
            <div class="title">Software Engineer</div>
            <div class="tagline">Full Stack Developer | IoT Specialist</div>
        </div>
        
        <div class="card-body">
            <div class="info-section">
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div class="info-text">
                        <a href="mailto:ratnajeetpatil64@gmail.com">ratnajeetpatil64@gmail.com</a>
                    </div>
                </div>
                
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="info-text">Pune, Maharashtra, India</div>
                </div>
                
                <div class="info-item">
                    <i class="fas fa-globe"></i>
                    <div class="info-text">
                        <a href="https://www.ratnajeet.dev" target="_blank" rel="noopener noreferrer">www.ratnajeet.dev</a>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <a href="tel:+919422221740" class="action-btn primary">
                    <i class="fas fa-phone"></i>
                    <span>Call Me</span>
                </a>
                <a href="mailto:ratnajeetpatil64@gmail.com" class="action-btn secondary">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                </a>
            </div>

            <button onclick="saveContact()" class="action-btn primary save-contact">
                <i class="fas fa-address-book"></i>
                <span>Save Contact</span>
            </button>

            <div class="social-links">
                <a href="https://www.linkedin.com/in/ratnajeet-patil-770b4a24a/" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://github.com/ratnajeet00" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.ratnajeet.dev" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Portfolio">
                    <i class="fas fa-briefcase"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Service Worker Registration for Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Inline service worker for offline functionality
                const swCode = `
                    const CACHE_NAME = 'ratnajeet-card-v1';
                    const urlsToCache = [
                        '/card.html',
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css',
                        'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap'
                    ];

                    self.addEventListener('install', function(event) {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(function(cache) {
                                    return cache.addAll(urlsToCache).catch(() => {
                                        // Fail silently if offline during install
                                    });
                                })
                        );
                    });

                    self.addEventListener('fetch', function(event) {
                        event.respondWith(
                            caches.match(event.request)
                                .then(function(response) {
                                    return response || fetch(event.request);
                                })
                                .catch(() => {
                                    // Return cached version if available
                                    return caches.match('/card.html');
                                })
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('✅ Offline support enabled'))
                    .catch(() => console.log('⚠️ Offline support unavailable'));
            });
        }

        function saveContact() {
            const button = event.target.closest('.save-contact');
            const originalHTML = button.innerHTML;
            
            // Create vCard with phone number
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:Ratnajeet Patil
N:Patil;Ratnajeet;;;
TITLE:Software Engineer
TEL;TYPE=CELL:+919422221740
EMAIL;TYPE=INTERNET:ratnajeetpatil64@gmail.com
URL:https://www.ratnajeet.dev
ADR;TYPE=WORK:;;Pune;Maharashtra;;India
NOTE:Full Stack Developer | IoT Specialist
END:VCARD`;

            // Create blob and download
            const blob = new Blob([vCard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Ratnajeet_Patil.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);

            // Success feedback
            button.innerHTML = '<i class="fas fa-check"></i><span>Saved!</span>';
            button.classList.add('success-animation');
            
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.classList.remove('success-animation');
            }, 2000);
        }

        // Add smooth animations on load
        document.addEventListener('DOMContentLoaded', function() {
            const infoItems = document.querySelectorAll('.info-item');
            infoItems.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateX(-30px)';
                setTimeout(() => {
                    item.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    item.style.opacity = '1';
                    item.style.transform = 'translateX(0)';
                }, 700 + (index * 100));
            });

            // Animate action buttons
            const actionButtons = document.querySelectorAll('.action-btn');
            actionButtons.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, 1000 + (index * 100));
            });

            // Animate social buttons
            const socialBtns = document.querySelectorAll('.social-btn');
            socialBtns.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'scale(0)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'scale(1)';
                }, 1300 + (index * 100));
            });

            // Add click effect to info items
            infoItems.forEach(item => {
                item.addEventListener('click', function() {
                    const link = this.querySelector('a');
                    if (link) {
                        link.click();
                    }
                });
            });

            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('.action-btn, .social-btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => ripple.remove(), 600);
                });
            });
        });

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReducedMotion) {
            // Pixel parallax effect for a subtle live feeling.
            document.addEventListener('mousemove', function(e) {
                const card = document.querySelector('.card-container');
                if (!card) return;

                const x = (e.clientX / window.innerWidth - 0.5) * 8;
                const y = (e.clientY / window.innerHeight - 0.5) * 6;
                card.style.setProperty('--card-x', `${x.toFixed(2)}px`);
                card.style.setProperty('--card-y', `${y.toFixed(2)}px`);
            });

            document.addEventListener('mouseleave', function() {
                const card = document.querySelector('.card-container');
                if (!card) return;
                card.style.setProperty('--card-x', '0px');
                card.style.setProperty('--card-y', '0px');
            });

            // Periodic live CRT-like pulse.
            setInterval(function () {
                document.body.classList.add('palette-shift');
                setTimeout(function () {
                    document.body.classList.remove('palette-shift');
                }, 220);
            }, 9000);

            function flickerTick() {
                document.body.classList.add('crt-flicker');
                setTimeout(function () {
                    document.body.classList.remove('crt-flicker');
                }, 90);
                setTimeout(flickerTick, 1700 + Math.random() * 2100);
            }

            flickerTick();
        }
    </script>
</body>
</html>
