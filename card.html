    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Fira Code', 'Consolas', monospace;
            background: #121212;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Animated background with code grid */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(41, 121, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(41, 121, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating code symbols */
        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(41, 121, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 191, 165, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 64, 129, 0.06) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        .card-container {
            /* Glassmorphism code-themed effect */
            background: rgba(18, 18, 18, 0.85);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(41, 121, 255, 0.2);
            border-radius: 16px;
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(41, 121, 255, 0.1),
                inset 0 1px 1px rgba(41, 121, 255, 0.1);
            max-width: 420px;
            width: 100%;
            margin: 20px auto;
            animation: slideUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            z-index: 1;
            overflow: visible;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Terminal-style header */
        .card-header {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.95) 0%, rgba(30, 30, 30, 0.95) 100%);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 20px 20px 35px;
            text-align: center;
            color: #E0E0E0;
            position: relative;
            overflow: hidden;
            border-radius: 16px 16px 0 0;
            border-bottom: 1px solid rgba(41, 121, 255, 0.2);
        }

        /* Terminal dots */
        .card-header::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 15px;
            width: 12px;
            height: 12px;
            background: #FF4081;
            border-radius: 50%;
            box-shadow: 
                18px 0 0 #F78C6C,
                36px 0 0 #00BFA5;
        }

        /* Code-style animated background */
        .card-header::after {
            content: '{ }';
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 150px;
            color: rgba(41, 121, 255, 0.05);
            transform: translate(-50%, -50%);
            font-family: 'Fira Code', monospace;
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.05; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.08; }
        }

        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #2979FF;
            box-shadow: 
                0 0 20px rgba(41, 121, 255, 0.5),
                0 15px 35px rgba(0, 0, 0, 0.5);
            margin: 0 auto 20px;
            object-fit: cover;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            animation: profilePop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s backwards;
            filter: brightness(1.05) contrast(1.1);
        }

        .profile-image:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 30px rgba(41, 121, 255, 0.8),
                0 20px 45px rgba(0, 0, 0, 0.6);
            border-color: #00BFA5;
        }

        @keyframes profilePop {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .card-header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            color: #E0E0E0;
            text-shadow: 0 2px 10px rgba(41, 121, 255, 0.3);
            animation: fadeInDown 0.6s ease 0.4s backwards;
        }

        /* Code-style prefix */
        .card-header h1::before {
            content: 'const ';
            color: #C792EA;
            font-family: 'Fira Code', monospace;
            font-size: 18px;
            margin-right: 8px;
        }

        .card-header h1::after {
            content: ' = "';
            color: #82AAFF;
            font-family: 'Fira Code', monospace;
            font-size: 18px;
        }

        .card-header .title {
            font-size: 17px;
            font-weight: 500;
            color: #F78C6C;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            animation: fadeInDown 0.6s ease 0.5s backwards;
            font-family: 'Fira Code', monospace;
        }

        .card-header .title::before {
            content: '// ';
            color: #6272A4;
            margin-right: 5px;
        }

        .card-header .tagline {
            font-size: 14px;
            color: #A0A0A0;
            font-weight: 300;
            position: relative;
            z-index: 1;
            animation: fadeInDown 0.6s ease 0.6s backwards;
            font-family: 'Fira Code', monospace;
        }

        .card-header .tagline::before {
            content: '/* ';
            color: #6272A4;
            margin-right: 5px;
        }

        .card-header .tagline::after {
            content: ' */';
            color: #6272A4;
            margin-left: 5px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-body {
            padding: 35px 25px;
            min-height: 400px;
            background: rgba(18, 18, 18, 0.6);
        }

        .info-section {
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.7) 0%, rgba(40, 40, 40, 0.5) 100%);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(41, 121, 255, 0.15);
            border-left: 3px solid #2979FF;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            font-family: 'Fira Code', monospace;
        }

        .info-item:hover {
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.15) 0%, rgba(0, 191, 165, 0.1) 100%);
            transform: translateX(8px);
            border-left-color: #00BFA5;
            border-color: rgba(0, 191, 165, 0.3);
            box-shadow: 0 5px 20px rgba(41, 121, 255, 0.2);
        }

        .info-item i {
            color: #2979FF;
            width: 40px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.15) 0%, rgba(0, 191, 165, 0.1) 100%);
            border-radius: 8px;
            padding: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(41, 121, 255, 0.2);
        }

        .info-item:hover i {
            transform: scale(1.1) rotate(5deg);
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.25) 0%, rgba(0, 191, 165, 0.2) 100%);
            border-color: #00BFA5;
            color: #00BFA5;
        }

        .info-item .info-text {
            flex: 1;
            color: #E0E0E0;
            font-size: 14px;
            font-weight: 500;
            margin-left: 15px;
        }

        .info-item a {
            color: #E0E0E0;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .info-item a:hover {
            color: #2979FF;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 30px;
            padding-top: 30px;
            margin-bottom: 20px;
            border-top: 1px solid rgba(41, 121, 255, 0.15);
        }

        .social-btn {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.2) 0%, rgba(0, 191, 165, 0.15) 100%);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(41, 121, 255, 0.3);
            color: #2979FF;
            font-size: 24px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-decoration: none;
            box-shadow: 0 5px 20px rgba(41, 121, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 12px;
            background: rgba(41, 121, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .social-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .social-btn:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 15px 35px rgba(41, 121, 255, 0.4);
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.4) 0%, rgba(0, 191, 165, 0.3) 100%);
            border-color: #00BFA5;
            color: #00BFA5;
        }

        .social-btn i {
            position: relative;
            z-index: 1;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-family: 'Fira Code', 'Poppins', monospace;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 8px;
            background: rgba(41, 121, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .action-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .action-btn i,
        .action-btn span {
            position: relative;
            z-index: 1;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.8) 0%, rgba(0, 191, 165, 0.6) 100%);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(41, 121, 255, 0.4);
            color: #E0E0E0;
            box-shadow: 0 8px 20px rgba(41, 121, 255, 0.25);
        }

        .action-btn.primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(41, 121, 255, 0.4);
            border-color: #00BFA5;
        }

        .action-btn.secondary {
            background: rgba(30, 30, 30, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: #2979FF;
            border: 2px solid rgba(41, 121, 255, 0.4);
        }

        .action-btn.secondary:hover {
            background: linear-gradient(135deg, rgba(41, 121, 255, 0.2) 0%, rgba(0, 191, 165, 0.15) 100%);
            color: #00BFA5;
            border-color: #00BFA5;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 191, 165, 0.3);
        }

        .save-contact {
            width: 100%;
            margin-top: 15px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 40px;
            }

            .card-container {
                border-radius: 12px;
                margin: 10px auto;
                max-width: 100%;
            }

            .card-header {
                padding: 20px 20px 30px;
                border-radius: 12px 12px 0 0;
            }

            .card-header h1 {
                font-size: 22px;
            }

            .card-header h1::before {
                font-size: 14px;
            }

            .card-header h1::after {
                font-size: 14px;
            }

            .card-header .title {
                font-size: 15px;
            }

            .card-header .tagline {
                font-size: 12px;
            }
            
            .profile-image {
                width: 100px;
                height: 100px;
            }

            .card-body {
                padding: 25px 20px 30px;
                min-height: 0;
            }

            .action-buttons {
                gap: 12px;
            }

            .action-btn {
                font-size: 12px;
                padding: 14px 10px;
            }

            .social-links {
                gap: 12px;
                margin-bottom: 0;
                padding-bottom: 10px;
            }

            .social-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
                border-radius: 10px;
            }

            .info-item {
                padding: 12px;
            }

            .info-item i {
                width: 35px;
                padding: 8px;
                font-size: 18px;
            }
        }

        @media (max-width: 380px) {
            .card-header h1 {
                font-size: 20px;
            }

            .action-btn {
                font-size: 11px;
                padding: 12px 8px;
            }

            .social-btn {
                width: 46px;
                height: 46px;
                font-size: 18px;
            }
        }

        /* Success animation */
        @keyframes success {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .success-animation {
            animation: success 0.5s ease;
            background: linear-gradient(135deg, rgba(0, 191, 165, 0.8) 0%, rgba(195, 232, 141, 0.6) 100%) !important;
            border-color: #00BFA5 !important;
        }

        /* Shimmer effect for primary buttons */
        .action-btn.primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(25deg);
            transition: left 0.7s;
        }

        .action-btn.primary:hover::after {
            left: 120%;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 8px;
            background: rgba(41, 121, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Smooth transitions for 3D effect */
        .card-container {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Hover glow effect */
        .card-container:hover {
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.5),
                0 0 40px rgba(41, 121, 255, 0.3),
                0 0 0 1px rgba(41, 121, 255, 0.2);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(18, 18, 18, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #2979FF 0%, #00BFA5 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #00BFA5 0%, #2979FF 100%);
        }
    </style>
</head>

    <script>
        // Service Worker Registration for Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Inline service worker for offline functionality
                const swCode = `
                    const CACHE_NAME = 'ratnajeet-card-v1';
                    const urlsToCache = [
                        '/card.html',
                        'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css',
                        'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap'
                    ];

                    self.addEventListener('install', function(event) {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(function(cache) {
                                    return cache.addAll(urlsToCache).catch(() => {
                                        // Fail silently if offline during install
                                    });
                                })
                        );
                    });

                    self.addEventListener('fetch', function(event) {
                        event.respondWith(
                            caches.match(event.request)
                                .then(function(response) {
                                    return response || fetch(event.request);
                                })
                                .catch(() => {
                                    // Return cached version if available
                                    return caches.match('/card.html');
                                })
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('✅ Offline support enabled'))
                    .catch(() => console.log('⚠️ Offline support unavailable'));
            });
        }

        function saveContact() {
            const button = event.target.closest('.save-contact');
            const originalHTML = button.innerHTML;
            
            // Create vCard with phone number
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:Ratnajeet Patil
N:Patil;Ratnajeet;;;
TITLE:Software Engineer
TEL;TYPE=CELL:+919422221740
EMAIL;TYPE=INTERNET:ratnajeetpatil64@gmail.com
URL:https://www.ratnajeet.dev
ADR;TYPE=WORK:;;Pune;Maharashtra;;India
NOTE:Full Stack Developer | IoT Specialist
END:VCARD`;

            // Create blob and download
            const blob = new Blob([vCard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Ratnajeet_Patil.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);

            // Success feedback
            button.innerHTML = '<i class="fas fa-check"></i><span>Saved!</span>';
            button.classList.add('success-animation');
            
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.classList.remove('success-animation');
            }, 2000);
        }

        // Add smooth animations on load
        document.addEventListener('DOMContentLoaded', function() {
            const infoItems = document.querySelectorAll('.info-item');
            infoItems.forEach((item, index) => {
                item.style.opacity = '0';
                item.style.transform = 'translateX(-30px)';
                setTimeout(() => {
                    item.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    item.style.opacity = '1';
                    item.style.transform = 'translateX(0)';
                }, 700 + (index * 100));
            });

            // Animate action buttons
            const actionButtons = document.querySelectorAll('.action-btn');
            actionButtons.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, 1000 + (index * 100));
            });

            // Animate social buttons
            const socialBtns = document.querySelectorAll('.social-btn');
            socialBtns.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'scale(0)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'scale(1)';
                }, 1300 + (index * 100));
            });

            // Add click effect to info items
            infoItems.forEach(item => {
                item.addEventListener('click', function() {
                    const link = this.querySelector('a');
                    if (link) {
                        link.click();
                    }
                });
            });

            // Add ripple effect to buttons
            const buttons = document.querySelectorAll('.action-btn, .social-btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.classList.add('ripple');
                    
                    this.appendChild(ripple);
                    
                    setTimeout(() => ripple.remove(), 600);
                });
            });
        });

        // Add subtle parallax effect on mouse move
        document.addEventListener('mousemove', function(e) {
            const card = document.querySelector('.card-container');
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;
            
            card.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // Reset card position on mouse leave
        document.addEventListener('mouseleave', function() {
            const card = document.querySelector('.card-container');
            card.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
        });
    </script>
</body>
</html>
